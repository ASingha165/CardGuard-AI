services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardguard
      POSTGRES_PASSWORD: cardguard_dev_password
      POSTGRES_DB: cardguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://cardguard:cardguard_dev_password@db:5432/cardguard
      API_KEY_SECRET: ${API_KEY_SECRET:-change-me-in-production}
      REQUIRE_AUTH: "true"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
